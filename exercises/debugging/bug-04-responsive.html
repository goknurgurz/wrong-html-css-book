<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hata 04 — Responsive grid</title>
  <style>
    .grid { display: grid; grid-template-columns: repeat(4, 280px); gap: 24px; }
    .card { min-height: 150px; padding: 20px; background: #f0d58a; }
  </style>
</head>
<body>
  <main class="grid">
    <article class="card">Kitap 1</article><article class="card">Kitap 2</article>
    <article class="card">Kitap 3</article><article class="card">Kitap 4</article>
  </main>
</body>
</html>
